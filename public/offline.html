<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0056FF" />
    <title>Offline | Sam Creative Design School</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050914;
        color: #ffffff;
        font-family: Arial, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 440px;
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        object-fit: contain;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      p {
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 20px;
        border-radius: 14px;
        background: #0056ff;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/scds-monogram.svg" alt="Sam Creative Design School" />
      <h1>You are offline</h1>
      <p>
        The SCDS app is installed, but this page needs an internet connection.
        Reconnect and try again to continue your lessons.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
