<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SCDS app icon</title>
  <desc id="desc">Sam Creative Design School app icon using the official website monogram logo.</desc>
  <defs>
    <linearGradient id="bg" x1="52" y1="36" x2="456" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06276F"/>
      <stop offset="0.62" stop-color="#0056FF"/>
      <stop offset="1" stop-color="#0A0F1E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="58" y="58" width="396" height="396" rx="96" fill="#ffffff" opacity="0.98" filter="url(#shadow)"/>
  <rect x="76" y="76" width="360" height="360" rx="78" fill="#ffffff"/>
  <image href="/images/scds-monogram.svg" x="76" y="76" width="360" height="360" preserveAspectRatio="xMidYMid meet"/>
</svg>
