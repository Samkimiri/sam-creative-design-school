    <path d="M166 165c29-21 59-31 90-31s61 10 90 31v44H166Z" fill="#0737B8" stroke="#FFFFFF" stroke-width="7"/>
    <path d="M376 158v73" stroke="#FFD43B" stroke-width="9" stroke-linecap="round"/>
    <circle cx="376" cy="239" r="14" fill="url(#ring)" stroke="#7D4B00" stroke-width="2"/>
    <path d="M360 257h32l-6 60-10-25-10 25Z" fill="url(#ring)" stroke="#8B5600" stroke-width="2" stroke-linejoin="round"/>

