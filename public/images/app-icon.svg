    <path d="M151 203c40-22 75-33 105-33s65 11 105 33v83c0 61-38 113-105 145-67-32-105-84-105-145Z" fill="url(#shield)"/>
    <path d="M151 203c40-22 75-33 105-33s65 11 105 33v25c-75-35-135-35-210 0Z" fill="#FFFFFF" opacity="0.82"/>

