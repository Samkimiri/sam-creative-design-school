    <path d="M256 61c112 0 203 89 203 198S368 457 256 457 53 368 53 259 144 61 256 61Zm0 35c-92 0-167 73-167 163s75 163 167 163 167-73 167-163S348 96 256 96Z" fill="url(#ring)" opacity="0.98"/>
