    <circle cx="455" cy="185" r="3"/><circle cx="505" cy="185" r="3"/><circle cx="555" cy="185" r="3"/><circle cx="605" cy="185" r="3"/>
    <circle cx="455" cy="235" r="3"/><circle cx="505" cy="235" r="3"/><circle cx="555" cy="235" r="3"/><circle cx="605" cy="235" r="3"/>
